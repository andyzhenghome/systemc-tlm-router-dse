<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img">
<title>拓扑对比：mesh / torus / ring</title>
<desc>同为 16 个节点，torus 因环绕链路把平均跳数从 3.67 降到 3.13，延迟与吞吐都优于 mesh；ring 平均跳数 5.27，延迟高出一个数量级。</desc>
<text x="40.0" y="32.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#2C2C2A" text-anchor="start" font-weight="500">拓扑对比：环绕链路值多少</text>
<text x="40.0" y="54.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">4×4 mesh / 4×4 torus / 16 节点 ring，同为 16 节点、XY 路由、uniform 流量</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="300.0" stroke="#D3D1C7" stroke-width="0.7"/>
<text x="250.0" y="320.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">10</text>
<line x1="384.0" y1="92.0" x2="384.0" y2="300.0" stroke="#D3D1C7" stroke-width="0.7"/>
<text x="384.0" y="320.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">30</text>
<line x1="530.9" y1="92.0" x2="530.9" y2="300.0" stroke="#D3D1C7" stroke-width="0.7"/>
<text x="530.9" y="320.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">100</text>
<line x1="664.9" y1="92.0" x2="664.9" y2="300.0" stroke="#D3D1C7" stroke-width="0.7"/>
<text x="664.9" y="320.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">300</text>
<text x="475.0" y="344.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">平均端到端延迟 (ns，对数轴)</text>
<text x="40.0" y="130.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">4×4 mesh</text>
<rect x="250.0" y="108.0" width="148.1" height="19.0" rx="3.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="405.1" y="122.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#185FA5" text-anchor="start" font-weight="400">33.7 ns</text>
<rect x="250.0" y="132.0" width="220.6" height="19.0" rx="3.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="477.6" y="146.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#185FA5" text-anchor="start" font-weight="400">61.0 ns</text>
<text x="40.0" y="146.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">上：gap=8   下：gap=4</text>
<text x="40.0" y="196.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">4×4 torus</text>
<rect x="250.0" y="174.0" width="104.9" height="19.0" rx="3.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="361.9" y="188.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#0F6E56" text-anchor="start" font-weight="400">23.6 ns</text>
<rect x="250.0" y="198.0" width="184.9" height="19.0" rx="3.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="441.9" y="212.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#0F6E56" text-anchor="start" font-weight="400">45.5 ns</text>
<text x="40.0" y="212.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">上：gap=8   下：gap=4</text>
<text x="40.0" y="262.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">16 节点 ring</text>
<rect x="250.0" y="240.0" width="420.2" height="19.0" rx="3.0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="677.2" y="254.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#993C1D" text-anchor="start" font-weight="400">313.2 ns</text>
<rect x="250.0" y="264.0" width="433.5" height="19.0" rx="3.0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="690.5" y="278.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#993C1D" text-anchor="start" font-weight="400">349.5 ns</text>
<text x="40.0" y="278.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">上：gap=8   下：gap=4</text>
<rect x="760.0" y="92.0" width="200.0" height="208.0" rx="8.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.7"/>
<text x="776.0" y="116.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="500">平均跳数 / 吞吐 (gap=4)</text>
<text x="776.0" y="146.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#185FA5" text-anchor="start" font-weight="500">4×4 mesh</text>
<text x="776.0" y="164.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">3.6667 hops  ｜  2400 msgs/us</text>
<text x="776.0" y="194.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56" text-anchor="start" font-weight="500">4×4 torus</text>
<text x="776.0" y="212.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">3.1333 hops  ｜  2775 msgs/us</text>
<text x="776.0" y="242.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#993C1D" text-anchor="start" font-weight="500">16 节点 ring</text>
<text x="776.0" y="260.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">5.2667 hops  ｜  332 msgs/us</text>
<rect x="40.0" y="356.0" width="920.0" height="20.0" rx="4.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="52.0" y="371.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">结论：torus 在两种负载下都优于 mesh（45.5 vs 61.0 ns @gap=4），代价是多一倍链路；ring 跳数暴涨，只适合极低成本场景。</text>
</svg>
