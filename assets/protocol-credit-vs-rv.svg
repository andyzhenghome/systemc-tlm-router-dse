<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img">
<title>AT credit 与 LT ready/valid：两套协议，两种探索粒度</title>
<desc>AT 用 credit 预约缓冲并有硬反压，能给出延迟-负载曲线与饱和点；LT 用 ready/valid 握手且下游恒 ready，只回答连通性与带宽是否够用。</desc>
<text x="40.0" y="32.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#2C2C2A" text-anchor="start" font-weight="500">两套流控协议，两种探索粒度</text>
<text x="40.0" y="54.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">同一份 router spec、同一条服务时间公式，差别在流控与时间模型</text>
<rect x="40.0" y="76.0" width="440.0" height="268.0" rx="10.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
<text x="60.0" y="104.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">AT  ｜  credit-based flow control</text>
<text x="60.0" y="126.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#185FA5" text-anchor="start" font-weight="500">细粒度探索：延迟和拥塞怎么样</text>
<text x="60.0" y="152.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  NI 持有 ni_window 个 credit（初值 8）</text>
<text x="60.0" y="178.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  BEGIN_REQ：--credit，占用上游一个槽</text>
<text x="60.0" y="204.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  链路忙 → link_free_at[op] 决定排队</text>
<text x="60.0" y="230.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  LINK_DONE：服务完成，释放输入槽</text>
<text x="60.0" y="256.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  BEGIN_RESP ≡ 归还一个 credit</text>
<text x="60.0" y="282.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  END_RESP 闭合，credit 数守恒</text>
<rect x="60.0" y="312.0" width="400.0" height="24.0" rx="4.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="70.0" y="329.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">实测：轻载 24.11 ns → 重载 72.29 ns，吞吐封顶</text>
<rect x="520.0" y="76.0" width="440.0" height="268.0" rx="10.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
<text x="540.0" y="104.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">LT  ｜  ready / valid handshake</text>
<text x="540.0" y="126.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56" text-anchor="start" font-weight="500">粗粒度探索：连通性和带宽够不够</text>
<text x="540.0" y="152.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  valid：上游声明本次事务有数据</text>
<text x="540.0" y="178.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  ready：下游声明本跳可以接收</text>
<text x="540.0" y="204.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  LT 没有队列，ready 恒为真</text>
<text x="540.0" y="230.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  没有重试，stalls = 0</text>
<text x="540.0" y="256.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  b_transport 一次走完整条路径</text>
<text x="540.0" y="282.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">•  delay 只累加每跳固定服务时间</text>
<rect x="540.0" y="312.0" width="400.0" height="24.0" rx="4.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="550.0" y="329.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="400">实测：延迟恒为 23.00 ns，对注入率不敏感</text>
<rect x="40.0" y="360.0" width="920.0" height="60.0" rx="8.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.7"/>
<text x="58.0" y="384.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">连通性 / 带宽账 → 用 LT：路径几跳、每跳占链路多久、需求带宽是否超过链路服务率</text>
<text x="58.0" y="406.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">延迟 / 拥塞 → 用 AT：排队等待分布、饱和点、最忙链路、注入率-延迟曲线</text>
</svg>
