<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img">
<title>架构探索闭环</title>
<desc>参数矩阵经过事务级快速仿真与解析校准，产出架构决策；对少数关键点再用周期级模型或 RTL 复核。</desc>
<text x="40.0" y="32.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#2C2C2A" text-anchor="start" font-weight="500">架构探索闭环：快模型负责搜索，慢模型负责验证</text>
<text x="40.0" y="54.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">43 轮扫描、单轮仿真内核约 6.9 ms，才跑得动「拓扑 × 路由 × 流量 × 注入率 × 消息长度」的组合</text>
<rect x="40.0" y="96.0" width="166.0" height="78.0" rx="10.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/>
<text x="56.0" y="120.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500">① 参数矩阵</text>
<text x="54.0" y="140.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">topo / routing / traffic</text>
<text x="54.0" y="156.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">gap / 消息长度 / 带宽</text>
<line x1="208.0" y1="135.0" x2="221.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.6"/>
<path d="M220.0 131.0 L228.0 135.0 L220.0 139.0 Z" fill="#5F5E5A"/>
<rect x="230.0" y="96.0" width="166.0" height="78.0" rx="10.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
<text x="246.0" y="120.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500">② 事务级仿真</text>
<text x="244.0" y="140.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">link_free_at 服务模型</text>
<text x="244.0" y="156.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">时间注解 + PEQ</text>
<line x1="398.0" y1="135.0" x2="411.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.6"/>
<path d="M410.0 131.0 L418.0 135.0 L410.0 139.0 Z" fill="#5F5E5A"/>
<rect x="420.0" y="96.0" width="166.0" height="78.0" rx="10.0" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.9"/>
<text x="436.0" y="120.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500">③ 解析校准</text>
<text x="434.0" y="140.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">零负载延迟 22 ns</text>
<text x="434.0" y="156.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">饱和吞吐、ρ≈1</text>
<line x1="588.0" y1="135.0" x2="601.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.6"/>
<path d="M600.0 131.0 L608.0 135.0 L600.0 139.0 Z" fill="#5F5E5A"/>
<rect x="610.0" y="96.0" width="166.0" height="78.0" rx="10.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
<text x="626.0" y="120.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500">④ 架构决策</text>
<text x="624.0" y="140.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">选拓扑、选路由</text>
<text x="624.0" y="156.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">定带宽与消息粒度</text>
<line x1="778.0" y1="135.0" x2="791.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.6"/>
<path d="M790.0 131.0 L798.0 135.0 L790.0 139.0 Z" fill="#5F5E5A"/>
<rect x="800.0" y="96.0" width="166.0" height="78.0" rx="10.0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/>
<text x="816.0" y="120.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500">⑤ 关键点复核</text>
<text x="814.0" y="140.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">周期级模型 / RTL</text>
<text x="814.0" y="156.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">VC / arbiter / HOL</text>
<rect x="40.0" y="200.0" width="920.0" height="62.0" rx="8.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.7"/>
<text x="56.0" y="224.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">能力边界：能回答拓扑 / 路由 / 容量 / 映射；不能回答 VC 数、arbiter 微架构、wormhole HOL、cycle 级尾延迟。</text>
<text x="56.0" y="246.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">AT 内核 6.88 ms vs LT 0.95 ms（约 7.3×）；43 轮扫描主体 3.9 s，换来整条延迟-负载曲线与饱和点。</text>
</svg>
