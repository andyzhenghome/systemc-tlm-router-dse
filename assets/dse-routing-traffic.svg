<text x="54.0" y="408.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">结论：路由选择必须绑定目标 workload；这正是架构探索要回答、而单点仿真回答不了的问题。</text>
