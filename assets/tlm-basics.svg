<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img">
<title>TLM 建模的基本思路：通信 = 事务 + 时间注解</title>
<desc>发起方通过 socket 把一个 tlm_generic_payload 交给目标，时间不靠 wait 而靠随事务传递的 sc_time&amp; delay 注解；AT 与 LT 是同一套接口上的两种时间编码风格。</desc>
<text x="40.0" y="32.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#2C2C2A" text-anchor="start" font-weight="500">TLM 建模的基本思路：通信 = 事务 + 时间注解</text>
<text x="40.0" y="54.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">不再描述信号与时钟沿，而是描述「谁在什么时候把什么交给谁」</text>
<rect x="40.0" y="80.0" width="200.0" height="60.0" rx="10.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/>
<text x="56.0" y="104.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">Initiator</text>
<text x="56.0" y="124.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">产生事务、携带 delay</text>
<line x1="240.0" y1="110.0" x2="285.0" y2="110.0" stroke="#5F5E5A" stroke-width="1.6"/>
<path d="M284.0 106.0 L292.0 110.0 L284.0 114.0 Z" fill="#5F5E5A"/>
<rect x="296.0" y="80.0" width="250.0" height="60.0" rx="10.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
<text x="312.0" y="104.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">socket</text>
<text x="312.0" y="124.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">fw / bw 两个方向</text>
<line x1="546.0" y1="110.0" x2="591.0" y2="110.0" stroke="#5F5E5A" stroke-width="1.6"/>
<path d="M590.0 106.0 L598.0 110.0 L590.0 114.0 Z" fill="#5F5E5A"/>
<rect x="602.0" y="80.0" width="200.0" height="60.0" rx="10.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/>
<text x="618.0" y="104.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">Target</text>
<text x="618.0" y="124.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">消费事务、回响应</text>
<text x="820.0" y="104.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="500">tlm_generic_payload</text>
<text x="820.0" y="124.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">command / address / data</text>
<text x="820.0" y="142.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">extension / mm</text>
<rect x="40.0" y="152.0" width="920.0" height="42.0" rx="8.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="58.0" y="178.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="400">sc_time&amp; delay 是时间支票：路由、排队、串行化都折算成偏移随事务走；不 wait、不需要 sc_clock</text>
<rect x="40.0" y="210.0" width="440.0" height="96.0" rx="10.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
<text x="56.0" y="234.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">AT：nb_transport_fw / bw + 四相 + PEQ</text>
<text x="58.0" y="250.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">非阻塞；能表达反压、排队与资源竞争</text>
<text x="58.0" y="272.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">BEGIN_REQ → END_REQ → BEGIN_RESP → END_RESP</text>
<text x="58.0" y="294.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">时间注解 + 扩展相位 + 时间事件队列</text>
<rect x="520.0" y="210.0" width="440.0" height="96.0" rx="10.0" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.9"/>
<text x="536.0" y="234.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500">LT：b_transport + quantum keeper</text>
<text x="538.0" y="250.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">阻塞；一次调用沿路径走到底，只累加时间</text>
<text x="538.0" y="272.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="400">trans.set_response_status(TLM_OK_RESPONSE)</text>
<text x="538.0" y="294.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">temporal decoupling：本地时间先跑，定期 sync</text>
<rect x="40.0" y="322.0" width="220.0" height="52.0" rx="7.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.6"/>
<text x="52.0" y="344.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="500">extension</text>
<text x="52.0" y="362.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">ignorable / instance-specific</text>
<rect x="275.0" y="322.0" width="220.0" height="52.0" rx="7.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.6"/>
<text x="287.0" y="344.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="500">memory manager</text>
<text x="287.0" y="362.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">payload 池、引用计数</text>
<rect x="510.0" y="322.0" width="220.0" height="52.0" rx="7.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.6"/>
<text x="522.0" y="344.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="500">DMI / debug</text>
<text x="522.0" y="362.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">直访与无副作用快照</text>
<rect x="745.0" y="322.0" width="220.0" height="52.0" rx="7.0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.6"/>
<text x="757.0" y="344.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="500">analysis port</text>
<text x="757.0" y="362.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">零时序影响的性能旁路</text>
<text x="40.0" y="400.0" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">本文两个模型共用同一套 TLM 接口与同一个 router spec，差别只在流控协议与时间模型。</text>
</svg>
